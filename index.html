---
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0f0d">
  <meta name="description" content="Privacy Policy for the Kuper Android customization app.">
  <title>Privacy Policy — Kuper</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #0b0f0d;
      --surface: #111815;
      --surface-hover: #17211b;
      --text: #edf3ee;
      --muted: #a0ada4;
      --line: #27332b;
      --accent: #b3dfbd;
      font-family: Geist, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: .22em; }
    a:hover { color: #d6f0db; text-decoration-thickness: 2px; }
    .wrap { width: min(100% - 40px, 760px); margin-inline: auto; }
    main { padding: clamp(52px, 9vw, 92px) 0 72px; }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.65rem, 8vw, 4.35rem);
      font-weight: 600;
      line-height: 1.04;
      letter-spacing: -.065em;
    }
    h2 {
      margin: 48px 0 12px;
      font-size: 1.3rem;
      font-weight: 570;
      line-height: 1.35;
      letter-spacing: -.025em;
      scroll-margin-top: 24px;
    }
    p { margin: 0 0 16px; }
    #policy-content > p:first-of-type {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: .91rem;
    }
    #policy-content > p:nth-of-type(3) {
      margin: 30px 0 38px;
      padding: 22px 26px;
      border: 1px solid var(--line);
      border-left: 2px solid var(--accent);
      border-radius: 4px 16px 16px 4px;
      background: var(--surface);
      color: #dce6de;
      font-size: 1.04rem;
    }
    #policy-content > h2:first-of-type {
      margin: 0 0 14px;
      font-size: .8rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    #policy-content > ul:first-of-type {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 28px;
      margin: 0;
      padding: 16px 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      list-style: none;
    }
    #policy-content > ul:first-of-type li { min-width: 0; }
    #policy-content > ul:first-of-type a {
      display: block;
      padding: 7px 0;
      color: var(--text);
      font-size: .94rem;
      text-decoration: none;
      transition: color .18s ease;
    }
    #policy-content > ul:first-of-type a::after { content: "↗"; float: right; color: #64736a; }
    #policy-content > ul:first-of-type a:hover { color: var(--accent); }
    #policy-content > ul:first-of-type a:hover::after { color: var(--accent); }
    #policy-content > ul:not(:first-of-type) { padding-left: 22px; }
    #policy-content > ul:not(:first-of-type) li { padding-left: 3px; }
    #policy-content > ul:not(:first-of-type) li + li { margin-top: 10px; }
    strong { color: #e6eee8; font-weight: 620; }
    hr { height: 1px; margin: 34px 0 18px; border: 0; background: var(--line); }
    #policy-content > p:last-child { margin: 0; color: var(--muted); font-size: .88rem; }
    @media (max-width: 560px) {
      .wrap { width: min(100% - 32px, 760px); }
      main { padding-top: 48px; }
      #policy-content > p:nth-of-type(3) { padding: 18px 20px; }
      #policy-content > ul:first-of-type { grid-template-columns: 1fr; padding: 12px 18px; }
      h2 { margin-top: 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="wrap" id="policy-content">
    {% capture policy %}{% include_relative PRIVACY.md %}{% endcapture %}
    {{ policy | markdownify }}
  </main>
</body>
</html>
