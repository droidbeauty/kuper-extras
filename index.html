<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#111714">
  <meta name="description" content="Privacy Policy for the Kuper Android customization app.">
  <title>Privacy Policy — Kuper</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #111714;
      --panel: #19211d;
      --text: #edf2ed;
      --muted: #b6c1b9;
      --line: #35413a;
      --accent: #b8e0bf;
      --soft: #202b25;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --page: #f4f6f2;
        --panel: #fff;
        --text: #19221c;
        --muted: #56635a;
        --line: #dce3dc;
        --accent: #315c3a;
        --soft: #edf2ed;
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--page); color: var(--text); line-height: 1.7; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-underline-offset: .2em; }
    a:hover { text-decoration-thickness: 2px; }
    .wrap { width: min(100% - 40px, 780px); margin-inline: auto; }
    main { padding: 54px 0 72px; }
    h1 { margin: 0 0 8px; font-size: clamp(2.25rem, 8vw, 3.8rem); line-height: 1.08; letter-spacing: -.055em; }
    h2 { margin: 42px 0 12px; font-size: 1.42rem; line-height: 1.3; letter-spacing: -.02em; }
    p { margin: 0 0 14px; }
    ul { padding-left: 22px; }
    li + li { margin-top: 7px; }
    #policy-content > p:nth-of-type(2) { padding: 22px 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); font-size: 1.05rem; }
    #policy-content > ul:first-of-type { margin: 0; padding: 20px 24px 20px 44px; border-radius: 18px; background: var(--soft); columns: 2; }
    #policy-content > ul:first-of-type li { break-inside: avoid; }
    #policy-content > ul:first-of-type a { color: var(--text); }
    #policy-content > p:last-child { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
    @media (max-width: 520px) {
      .wrap { width: min(100% - 28px, 780px); }
      main { padding-top: 36px; }
      #policy-content > p:nth-of-type(2) { padding: 18px; }
      #policy-content > ul:first-of-type { padding: 18px 18px 18px 38px; columns: 1; }
    }
  </style>
</head>
<body>
  <main class="wrap" id="policy-content">
    {% capture policy %}{% include_relative PRIVACY.md %}{% endcapture %}
    {{ policy | markdownify }}
  </main>
</body>
</html>
